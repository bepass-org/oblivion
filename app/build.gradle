plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.bepass.oblivion'
    compileSdk 35
    ndkVersion "26.1.10909125"
    defaultConfig {
        applicationId "org.bepass.oblivion"
        minSdk 24 // Android 7.0; enables modern features without legacy shims
        targetSdk 35
        versionCode 18
        versionName "8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    androidResources {
        generateLocaleConfig true
    }
    buildFeatures {
        dataBinding = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/LICENSE.md",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/NOTICE.md",
                    "META-INF/ASL2.0",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/*.kotlin_module"
            ]
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
}

configurations {
    configureEach {
        exclude group: 'org.json', module: 'json'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.zcweng:switch-button:0.0.3@aar'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.erfansn:locale-config-x:1.0.1'
    implementation 'com.tencent:mmkv:1.3.14' // we version 1.3.* to support 32-bit
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}

static def isWindows() { System.getProperty('os.name').toLowerCase().contains('win') }
static def findExecutable(String name) {
    try {
        def proc = isWindows() ? ["cmd", "/c", "where", name].execute() : ["which", name].execute()
        def out = new StringBuffer()
        def err = new StringBuffer()
        proc.consumeProcessOutput(out, err)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def path = out.toString().readLines().find { it?.trim() }
            if (path && new File(path.trim()).exists()) return path.trim()
        }
    } catch (ignored) {}
    return null
}

static def findGoExecutable() {
    def goPath = findExecutable('go')
    if (!goPath) throw new GradleException('Go executable not found in PATH.')
    return goPath
}

static def findGomobileExecutable(goExec) {
    def gomobilePath = findExecutable('gomobile')
    if (gomobilePath) return gomobilePath

    // fallback to GOPATH/bin/gomobile (usually ~/go/bin/gomobile)
    def fallback = new File(System.getProperty('user.home'), 'go/bin/gomobile').absolutePath
    if (new File(fallback).exists()) return fallback

    // try to install cross-platform
    println 'Installing gomobile...'
    def install = [goExec, 'install', 'golang.org/x/mobile/cmd/gomobile@latest'].execute()
    install.waitForProcessOutput(System.out, System.err)
    if (install.exitValue() != 0) throw new GradleException('Failed to install gomobile')
    if (new File(fallback).exists()) return fallback
    // try PATH again
    gomobilePath = findExecutable('gomobile')
    if (gomobilePath) return gomobilePath
    throw new GradleException('gomobile not found after installation')
}

def goExec = findGoExecutable()
def gomobileExec = findGomobileExecutable(goExec)

tasks.register("preBuildTun2SocksAar", Exec) {
    workingDir "../tun2socks"
    commandLine gomobileExec, "init"
    // Run once and cache a stamp to avoid repeated init
    outputs.file("$projectDir/../tun2socks/.gomobile-initialized")
    onlyIf { !file("$projectDir/../tun2socks/.gomobile-initialized").exists() }
    doLast {
        new File("$projectDir/../tun2socks/.gomobile-initialized").text = "ok"
    }
}

tasks.register("buildTun2SocksAar", Exec) {
    doFirst {
        File myDir = new File("$projectDir/libs")
        if (!myDir.exists()) {
            myDir.mkdirs()
        }
    }

    workingDir "../tun2socks"
    commandLine gomobileExec, "bind",
            "-ldflags=-w -s",
            "-target=android",
            "-androidapi=${android.defaultConfig.minSdk}",
            "-o=$projectDir/libs/tun2socks.aar", "."

    // Make task incremental: rebuild only if Go sources or go.mod/sum changed
    inputs.files(project.fileTree("../tun2socks") {
        include "**/*.go"
    })
    inputs.file("../tun2socks/go.mod")
    inputs.file("../tun2socks/go.sum")
    outputs.file("$projectDir/libs/tun2socks.aar")

    dependsOn("preBuildTun2SocksAar")
}

tasks.named("preBuild").configure { dependsOn("buildTun2SocksAar") }