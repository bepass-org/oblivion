plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'org.bepass.oblivion'
    ndkVersion = "26.1.10909125"
    // Optional: allow building against Android preview SDKs when provided
    def preview = project.findProperty("android.previewSdk")
    def numericSdk = project.findProperty("android.sdk")
    if (preview) {
        compileSdkPreview = preview
    } else if (numericSdk) {
        compileSdk = Integer.parseInt(numericSdk.toString())
    } else {
        compileSdk = 35
    }
    defaultConfig {
        applicationId "org.bepass.oblivion"
        minSdk = 21
        if (preview) {
            targetSdkPreview = preview
        } else if (numericSdk) {
            targetSdk = Integer.parseInt(numericSdk.toString())
        } else {
            targetSdk = 35
        }
        versionCode = 18
        versionName = "8"
        // Limit packaged locales: use androidResources.localeFilters (resConfigs locales removed)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }
    androidResources {
        generateLocaleConfig = true
        // Ensure only these locales are merged/packaged to avoid TR merge issues
        localeFilters.addAll(["en", "fa", "ru", "tr", "zh"])
    }
    buildFeatures {
        dataBinding = true
        buildConfig = true
    }
    signingConfigs {
        release {
            def debugKeystorePath = System.properties['user.home'] + File.separator + ".android" + File.separator + "debug.keystore"
            storeFile file(debugKeystorePath)
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/LICENSE.md",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/NOTICE.md",
                    "META-INF/ASL2.0",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/*.kotlin_module"
            ]
        }
    }
}

configurations {
    configureEach {
        exclude group: 'org.json', module: 'json'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.zcweng:switch-button:0.0.3@aar'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.erfansn:locale-config-x:1.0.1'
    implementation 'com.tencent:mmkv:1.3.14'
    // Android 12+ SplashScreen API
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

static def isWindows() { System.getProperty('os.name').toLowerCase().contains('win') }
static def findExecutable(String name) {
    try {
        def proc = isWindows() ? ["cmd", "/c", "where", name].execute() : ["which", name].execute()
        def out = new StringBuffer()
        def err = new StringBuffer()
        proc.consumeProcessOutput(out, err)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def path = out.toString().readLines().find { it?.trim() }
            if (path && new File(path.trim()).exists()) return path.trim()
        }
    } catch (ignored) {}
    return null
}

static def findGomobileExecutable(goExec) {
    def gomobilePath = findExecutable('gomobile')
    if (gomobilePath) return gomobilePath

    // fallback to GOPATH/bin/gomobile (usually ~/go/bin/gomobile)
    def fallback = new File(System.getProperty('user.home'), 'go/bin/gomobile').absolutePath
    if (new File(fallback).exists()) return fallback

    // try to install cross-platform
    println 'Installing gomobile...'
    def install = [goExec, 'install', 'golang.org/x/mobile/cmd/gomobile@latest'].execute()
    install.waitForProcessOutput(System.out, System.err)
    if (install.exitValue() != 0) throw new GradleException('Failed to install gomobile')
    if (new File(fallback).exists()) return fallback
    // try PATH again
    gomobilePath = findExecutable('gomobile')
    if (gomobilePath) return gomobilePath
    throw new GradleException('gomobile not found after installation')
}

tasks.register("preBuildTun2SocksAar", Exec) {
    workingDir "../tun2socks"
    doFirst {
        def goExec = findExecutable('go')
        if (!goExec) throw new GradleException('Go executable not found in PATH.')
        def gomobileExec = findGomobileExecutable(goExec)
        commandLine gomobileExec, "init"
    }
    // Run once and cache a stamp to avoid repeated init
    outputs.file("$projectDir/../tun2socks/.gomobile-initialized")
    onlyIf { !file("$projectDir/../tun2socks/.gomobile-initialized").exists() }
    doLast {
        new File("$projectDir/../tun2socks/.gomobile-initialized").text = "ok"
    }
}

tasks.register("buildTun2SocksAar", Exec) {
    workingDir "../tun2socks"
    doFirst {
        File myDir = new File("$projectDir/libs")
        if (!myDir.exists()) {
            myDir.mkdirs()
        }
        def goExec = findExecutable('go')
        if (!goExec) throw new GradleException('Go executable not found in PATH.')
        def gomobileExec = findGomobileExecutable(goExec)
        commandLine gomobileExec, "bind",
                "-ldflags=-w -s",
                "-target=android",
                "-androidapi=${android.defaultConfig.minSdk}",
                "-o=$projectDir/libs/tun2socks.aar", "."
    }

    // Make task incremental: rebuild only if Go sources or go.mod/sum changed
    inputs.files(project.fileTree("../tun2socks") {
        include "**/*.go"
    })
    inputs.file("../tun2socks/go.mod")
    inputs.file("../tun2socks/go.sum")
    outputs.file("$projectDir/libs/tun2socks.aar")

    dependsOn("preBuildTun2SocksAar")
}

tasks.named("preBuild").configure { dependsOn("buildTun2SocksAar") }

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-unchecked'
}