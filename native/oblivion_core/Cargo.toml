[package]
name = "oblivion_core"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "oblivion_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "oblivion-helper"
path = "src/bin/oblivion-helper.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
